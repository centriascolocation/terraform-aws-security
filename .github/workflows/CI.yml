name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.9.8", "1.15.0"]
    env:
      TF_IN_AUTOMATION: "true"
      AWS_REGION: eu-central-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Validate modules and examples
        shell: bash
        run: |
          set -euo pipefail
          for directory in modules/* examples/*; do
            [ -d "$directory" ] || continue
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" validate
          done
      - name: Run offline mock-plan tests
        shell: bash
        run: |
          set -euo pipefail
          for module in secure-s3-bucket cloudtrail config security-hub; do
            terraform -chdir="modules/$module" test
          done
